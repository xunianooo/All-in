name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Offline tests
        run: ./gradlew offlineTests --no-daemon
      - name: Dashboard setup and routing regressions
        run: |
          node tests/dashboard-setup-key.cjs
          node tests/dashboard-routing-audit.cjs
          node tests/dashboard-exposed.cjs
      - name: Fresh setup HTTP integration
        run: ./gradlew setupKeyHttpTests --no-daemon
      - name: Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # 正式签名包需要 secrets：MAGPIE_KEYSTORE(base64)、MAGPIE_KEYSTORE_PASS

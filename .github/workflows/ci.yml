name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: '155.0.8059.41'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 37
        shell: pwsh
        run: sdkmanager --install "platforms;android-37.0"
      - name: Offline tests
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Windows") { ./gradlew.bat offlineTests --no-daemon }
          else { ./gradlew offlineTests --no-daemon }
      - name: Dashboard setup and routing regressions
        env:
          ALLIN_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          node scripts/run-dashboard-regressions.cjs
      - name: Fresh setup HTTP integration
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Windows") { ./gradlew.bat setupKeyHttpTests --no-daemon }
          else { ./gradlew setupKeyHttpTests --no-daemon }
      - name: Streaming HTTP pacing and gated tools
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Windows") { ./gradlew.bat streamingHttpTests outboundRoutingHttpTests --no-daemon }
          else { ./gradlew streamingHttpTests outboundRoutingHttpTests --no-daemon }
      - name: Debug APK
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Windows") { ./gradlew.bat assembleDebug --no-daemon }
          else { ./gradlew assembleDebug --no-daemon }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'ubuntu-latest' && 'all-in-debug-apk' || 'all-in-debug-apk-windows' }}
          path: app/build/outputs/apk/debug/*.apk
      # 正式签名包需要 secrets：MAGPIE_KEYSTORE(base64)、MAGPIE_KEYSTORE_PASS
      # 验证稳定后取消注释：

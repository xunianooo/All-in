      #   env:
      #     MAGPIE_KEYSTORE: ${{ github.workspace }}/magpie.keystore
      #     MAGPIE_KEYSTORE_PASS: ${{ secrets.MAGPIE_KEYSTORE_PASS }}
      #   run: |
      #     echo "${{ secrets.MAGPIE_KEYSTORE_BASE64 }}" | base64 -d > magpie.keystore
      #     ./gradlew assembleRelease --no-daemon

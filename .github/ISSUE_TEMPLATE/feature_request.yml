name: 功能建议 / Feature request
description: 提出改进建议或描述希望解决的使用场景。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的需求或问题
      description: 请描述使用场景和当前遇到的困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改进
      description: 请描述你希望增加或调整的功能。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可以提供示例或替代方案；请勿提交密钥、账号信息和敏感内容。

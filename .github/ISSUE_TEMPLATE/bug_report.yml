name: 问题反馈 / Bug report
description: 报告使用 All In 时遇到的问题，帮助我们复现和定位。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！Issue 是公开的，请不要填写 API Key、登录凭据、验证码、私钥、真实账号信息或未经脱敏的日志。可以由用户本人或经用户授权的 Agent 提交。
  - type: input
    id: version
    attributes:
      label: All In 版本
      description: 请填写版本号及 versionCode（如有）。
      placeholder: 例如 1.2.23-test / 29
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备和使用环境
      description: 手机型号、Android 版本；如涉及电脑客户端，请填写客户端名称和版本。
      placeholder: 例如 Android 16，客户端版本 …
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？涉及哪个供应商、模型或功能？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序说明操作，以及是否每次都发生。
      placeholder: |
        1. 打开 …
        2. 选择 …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你原本希望发生什么？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的错误信息、日志或截图
      description: 请先移除口令、密钥、Token、验证码、个人信息和敏感对话；无需公开原始配置或账本。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已检查内容，未包含凭据、验证码或其他不应公开的个人信息。
          required: true

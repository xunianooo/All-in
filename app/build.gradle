plugins {
    id 'com.android.application'
}

// 产物命名跟产品名走：AllIn-release.apk / AllIn-debug.apk
base {
    archivesName = 'AllIn'
}

android {
    namespace 'com.gaeul.allin'
    compileSdk 37

    defaultConfig {
        applicationId 'com.gaeul.allin'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.2.2'
    }

    signingConfigs {
        release {
            // 密钥不进仓库：优先环境变量，其次构建机本地路径
            // 用法（电脑端）：
            //   MAGPIE_KEYSTORE=/path/to/magpie.keystore
            //   MAGPIE_KEYSTORE_PASS=口令
            // （手机端对应 /workspace/tools/magpie.keystore 与 .keystore-pass）
            storeFile file(System.getenv('MAGPIE_KEYSTORE')
                    ?: '/workspace/tools/magpie.keystore')
            storePassword System.getenv('MAGPIE_KEYSTORE_PASS') ?: ''
            keyAlias System.getenv('MAGPIE_KEY_ALIAS') ?: 'magpie'
            keyPassword System.getenv('MAGPIE_KEY_PASS')
                    ?: System.getenv('MAGPIE_KEYSTORE_PASS') ?: ''
            // v3 签名支持密钥轮换（借鉴手机端构建的做法）
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            // 代码大量使用反射，禁用 R8 裁剪/混淆
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // 迁移期先不把 lint 当门禁
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}

// ===== 原有 main() 风格离线测试：不改测试代码，用 JavaExec 驱动 =====
// 测试文件原样放在 src/test/java，断言失败抛 AssertionError 即任务失败
configurations { offlineTest }
dependencies { offlineTest 'org.nanohttpd:nanohttpd:2.3.1' }

// 保留原有 9 个套件，并运行网关、Responses 和首次设置回归测试。
def offlineTestMains = [
        'com.gaeul.allin.AnthropicBridgeRequestTest',
        'com.gaeul.allin.AnthropicBridgeStreamOfflineTest',
        'com.gaeul.allin.ContextGuardOfflineTest',
        'com.gaeul.allin.ContextGuardProtectionTest',
        'com.gaeul.allin.ZCodeAnthropicOfflineTest',
        'com.gaeul.allin.GatewayProtocolOfflineTest',
        'com.gaeul.allin.DeepSeekWebTest',
        'com.gaeul.allin.DeepSeekWebChatTest',
        'com.gaeul.allin.DeepSeekToolBridgeTest',
        'com.gaeul.allin.GatewayMissingProviderOfflineTest',
        'com.gaeul.allin.ResponsesBridgeOfflineTest',
        'com.gaeul.allin.ResponsesBridgeAuditTest',
        'com.gaeul.allin.ResponsesGatewayOfflineTest',
        'com.gaeul.allin.RoutingSetupOfflineTest',
        'com.gaeul.allin.GatewayAuditOfflineTest',
        'com.gaeul.allin.RoutingAuditOfflineTest',
        'com.gaeul.allin.SetupKeyOfflineTest',
]

def mainClassesDir = provider { tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().destinationDirectory.get() }
def testClassesDir = layout.buildDirectory.dir('offlinetest-classes')

tasks.register('compileOfflineTests', JavaCompile) {
    dependsOn 'compileReleaseJavaWithJavac'
    source = fileTree(dir: 'src/test/java')
    // 补丁版 org.json 在主代码产物里，必须排在 android.jar 之前
    classpath = files({ [mainClassesDir.get(), configurations.offlineTest, tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().options.bootstrapClasspath] })
    destinationDirectory = testClassesDir
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

def offlineTestTasks = offlineTestMains.collect { name ->
    def simple = name.substring(name.lastIndexOf('.') + 1)
    tasks.register("offlineTest_${simple}", JavaExec) {
        group = 'verification'
        description = "运行离线测试 ${name}"
        dependsOn 'compileOfflineTests'
        classpath = files({ [mainClassesDir.get(), testClassesDir.get(), configurations.offlineTest, tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().options.bootstrapClasspath] })
        mainClass = name
    }
}

tasks.register('offlineTests') {
    group = 'verification'
    description = '依次运行原有 main() 风格离线测试（不改测试代码）'
    dependsOn offlineTestTasks
}


tasks.register('setupKeyHttpTests', JavaExec) {
    group = 'verification'
    description = '运行真实网关 HTTP 首次设置测试'
    dependsOn 'compileOfflineTests'
    classpath = files({ [mainClassesDir.get(), testClassesDir.get(), configurations.offlineTest, tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().options.bootstrapClasspath] })
    mainClass = 'com.gaeul.allin.SetupKeyOfflineTest'
    args '--http-test', rootProject.projectDir.absolutePath
}

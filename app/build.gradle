    description = '运行真实网关 HTTP 首次设置测试'
    dependsOn 'compileOfflineTests'
    classpath = files({ [mainClassesDir.get(), testClassesDir.get(), configurations.offlineTest, tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().options.bootstrapClasspath] })
    mainClass = 'com.gaeul.allin.SetupKeyOfflineTest'
    args '--http-test', rootProject.projectDir.absolutePath
}

// Native Messages -> Anthropic -> Messages signatures and HTTP lifecycle.
tasks.register('nativeAnthropicHttpTests', JavaExec) {
    group = 'verification'
    description = '运行原生 Anthropic 签名、隐私与流生命周期 HTTP 测试'
    dependsOn 'compileOfflineTests'
    classpath = files({ [mainClassesDir.get(), testClassesDir.get(), configurations.offlineTest, tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().options.bootstrapClasspath] })
    mainClass = 'com.gaeul.allin.NativeAnthropicHttpTest'
}
tasks.named('streamingHttpTests') { dependsOn 'nativeAnthropicHttpTests' }

// Every JavaExec uses the real lazy on-disk privacy scope, isolated from user data.
tasks.withType(JavaExec).configureEach {
    doFirst {
        def privateScope = java.nio.file.Files.createTempDirectory('allin-privacy-test-').toFile()
        systemProperty 'allin.test.privateDir', privateScope.absolutePath
        extensions.extraProperties.set('privacyTestScope', privateScope)
    }
    doLast {
        if (extensions.extraProperties.has('privacyTestScope')) delete extensions.extraProperties.get('privacyTestScope')
    }
}

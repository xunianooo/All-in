plugins {
    id 'com.android.application'
}

// 产物命名跟产品名走：AllIn-release.apk / AllIn-debug.apk
base {
    archivesName = 'AllIn'
}

android {
    namespace 'com.gaeul.allin'
    compileSdk 37

    defaultConfig {
        applicationId 'com.gaeul.allin'
        minSdk 24
        targetSdk 34
        versionCode 27
        versionName '1.2.21'
    }

    signingConfigs {
        release {
            // 密钥不进仓库：优先环境变量，其次构建机本地路径
            // 用法（电脑端）：
            //   MAGPIE_KEYSTORE=/path/to/magpie.keystore
            //   MAGPIE_KEYSTORE_PASS=口令
            // （手机端对应 /workspace/tools/magpie.keystore 与 .keystore-pass）
            storeFile file(System.getenv('MAGPIE_KEYSTORE')
                    ?: '/workspace/tools/magpie.keystore')
            storePassword System.getenv('MAGPIE_KEYSTORE_PASS') ?: ''
            keyAlias System.getenv('MAGPIE_KEY_ALIAS') ?: 'magpie'
            keyPassword System.getenv('MAGPIE_KEY_PASS')
                    ?: System.getenv('MAGPIE_KEYSTORE_PASS') ?: ''
            // v3 签名支持密钥轮换（借鉴手机端构建的做法）
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            // 代码大量使用反射，禁用 R8 裁剪/混淆
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // 迁移期先不把 lint 当门禁
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}


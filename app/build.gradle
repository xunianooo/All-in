    classpath = files({ [mainClassesDir.get(), antigravityOfflineTestClasses.get(), configurations.offlineTest, tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().options.bootstrapClasspath] })
    mainClass = 'com.gaeul.allin.AntigravityClientOfflineTest'
}

def offlineTestTasks = offlineTestMains.collect { name ->
    def simple = name.substring(name.lastIndexOf('.') + 1)
    tasks.register("offlineTest_${simple}", JavaExec) {
        group = 'verification'
        description = "运行离线测试 ${name}"
        dependsOn 'compileOfflineTests'
        classpath = files({ [mainClassesDir.get(), testClassesDir.get(), configurations.offlineTest, tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().options.bootstrapClasspath] })
        mainClass = name
        if (simple == 'ProviderStreamContractHttpTest') args rootProject.file('tests/fixtures/provider-stream-oracles-20261113.json').absolutePath
        if (simple == 'ProviderUpstreamParityOfflineTest') args rootProject.file('tests/fixtures/provider-upstream-20261113.json').absolutePath
        if (simple == 'ZCodePromptParityOfflineTest') args rootProject.file('tests/fixtures/zcode-prompt-3.17.2.json').absolutePath
    }
}


def mainClassesDir = provider { tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().destinationDirectory.get() }
def testClassesDir = layout.buildDirectory.dir('offlinetest-classes')

tasks.register('compileOfflineTests', JavaCompile) {
    dependsOn 'compileReleaseJavaWithJavac'
    source = fileTree(dir: 'src/test/java')
    // 补丁版 org.json 在主代码产物里，必须排在 android.jar 之前
    classpath = files({ [mainClassesDir.get(), configurations.offlineTest, tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().options.bootstrapClasspath] })
    destinationDirectory = testClassesDir
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

def offlineTestTasks = offlineTestMains.collect { name ->
    def simple = name.substring(name.lastIndexOf('.') + 1)
    tasks.register("offlineTest_${simple}", JavaExec) {
        group = 'verification'
        description = "运行离线测试 ${name}"
        dependsOn 'compileOfflineTests'
        classpath = files({ [mainClassesDir.get(), testClassesDir.get(), configurations.offlineTest, tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().options.bootstrapClasspath] })
        mainClass = name
    }
}

tasks.register('offlineTests') {
    group = 'verification'
    description = '依次运行原有 main() 风格离线测试（不改测试代码）'
    dependsOn offlineTestTasks
}


tasks.register('streamingHttpTests', JavaExec) {
    group = 'verification'
    description = '运行真实环回 HTTP 流式节奏回归测试'
    dependsOn 'compileOfflineTests'
    classpath = files({ [mainClassesDir.get(), testClassesDir.get(), configurations.offlineTest, tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().options.bootstrapClasspath] })
    mainClass = 'com.gaeul.allin.GatewayStreamingHttpTest'
}

tasks.register('setupKeyHttpTests', JavaExec) {

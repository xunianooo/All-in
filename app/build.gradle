// Protocol contract and diagnostic loopback regressions share the existing local HTTP gate.
['ProtocolDiagnosticsHttpTest', 'ToolContractFailoverHttpTest', 'SessionAffinityHttpTest', 'ProviderQuirksHttpTest', 'QuirksGatewayHttpTest', 'MiniMaxIntegrationHttpTest', 'IngressBodyHttpTest', 'IngressGatewayHttpTest', 'ImageGatewayHttpTest'].each { name ->
    def taskName = name.substring(0, 1).toLowerCase() + name.substring(1)
    tasks.register(taskName, JavaExec) {
        dependsOn 'compileOfflineTests'
        classpath = files({ [mainClassesDir.get(), testClassesDir.get(), configurations.offlineTest, tasks.named('compileReleaseJavaWithJavac', JavaCompile).get().options.bootstrapClasspath] })
        mainClass = 'com.gaeul.allin.' + name
    }
    tasks.named('streamingHttpTests') { dependsOn taskName }
}

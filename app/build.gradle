plugins {
    id 'com.android.application'
}

// 产物命名跟产品名走：AllIn-release.apk / AllIn-debug.apk
base {
    archivesName = 'AllIn'
}

android {
    namespace 'com.gaeul.allin'
    compileSdk 37

    defaultConfig {
        applicationId 'com.gaeul.allin'
        minSdk 24
        targetSdk 34
        versionCode 47
        versionName '1.2.41-test'
        testInstrumentationRunner 'com.gaeul.allin.RepairInstrumentation'
    }

    signingConfigs {
        release {
            // 密钥不进仓库：优先环境变量，其次构建机本地路径
            // 用法（电脑端）：
            //   MAGPIE_KEYSTORE=/path/to/magpie.keystore
            //   MAGPIE_KEYSTORE_PASS=口令
            // （手机端对应 /workspace/tools/magpie.keystore 与 .keystore-pass）
            storeFile file(System.getenv('MAGPIE_KEYSTORE')
                    ?: '/workspace/tools/magpie.keystore')
            storePassword System.getenv('MAGPIE_KEYSTORE_PASS') ?: ''
            keyAlias System.getenv('MAGPIE_KEY_ALIAS') ?: 'magpie'
            keyPassword System.getenv('MAGPIE_KEY_PASS')
                    ?: System.getenv('MAGPIE_KEYSTORE_PASS') ?: ''
            // v3 签名支持密钥轮换（借鉴手机端构建的做法）
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            // Opt-in device testing must never replace the user's installed package or accounts.
            if (project.hasProperty('isolatedTestInstall')) applicationIdSuffix '.repairtest'
        }
        release {
            // 代码大量使用反射，禁用 R8 裁剪/混淆
            minifyEnabled false
            signingConfig project.hasProperty('unsignedRelease') ? null : signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // Release builds must pass lint; suppressions need a local, documented reason.
        checkReleaseBuilds true
        abortOnError true
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}

// ===== 原有 main() 风格离线测试：不改测试代码，用 JavaExec 驱动 =====
// 测试文件原样放在 src/test/java，断言失败抛 AssertionError 即任务失败
configurations { offlineTest }
dependencies {
    offlineTest 'org.nanohttpd:nanohttpd:2.3.1'
    // Windows-only durable rename for offline tests; not an Android implementation dependency.
    offlineTest 'net.java.dev.jna:jna:5.17.0'
}


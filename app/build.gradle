// Every JavaExec owns an isolated scope and a finalizer, including failure/timeout paths.
tasks.withType(JavaExec).configureEach {
    timeout = java.time.Duration.ofSeconds(120)
    jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8'
    doFirst {
        def parent = layout.buildDirectory.dir('private-test-scopes').get().asFile
        parent.mkdirs()
        def privateScope = java.nio.file.Files.createTempDirectory(parent.toPath(), 'scope-').toFile()
        systemProperty 'allin.test.privateDir', privateScope.absolutePath
        systemProperty 'java.io.tmpdir', privateScope.absolutePath
        extensions.extraProperties.set('privacyTestScope', privateScope)
    }
}
